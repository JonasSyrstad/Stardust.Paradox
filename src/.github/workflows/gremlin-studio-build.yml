name: Build Gremlin Studio

on:
  push:
    branches: [ V2.6, main ]
    paths:
      - 'StardustGremlinStudio/**'
      - '.github/workflows/gremlin-studio-build.yml'
  pull_request:
    branches: [ V2.6, main ]
    paths:
      - 'StardustGremlinStudio/**'
  release:
    types: [ published ]
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0.x'
  PROJECT_PATH: 'StardustGremlinStudio/Stardust.Paradox.GremlinStudio/Stardust.Paradox.GremlinStudio.csproj'
  APP_ID: 'GremlinStudio'

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore ${{ env.PROJECT_PATH }}

    - name: Build
      run: dotnet build ${{ env.PROJECT_PATH }} -c Release --no-restore

    - name: Publish (Self-contained Single File - for standalone distribution)
      run: |
        dotnet publish ${{ env.PROJECT_PATH }} -c Release -o ./publish/win-x64-single `
          -r win-x64 `
          --self-contained true `
          -p:PublishSingleFile=true `
          -p:PublishReadyToRun=true `
          -p:IncludeNativeLibrariesForSelfExtract=true `
          -p:EnableCompressionInSingleFile=true

    - name: Publish (Self-contained for Velopack auto-update)
      run: |
        dotnet publish ${{ env.PROJECT_PATH }} -c Release -o ./publish/win-x64-velopack `
          -r win-x64 `
          --self-contained true `
          -p:PublishSingleFile=false `
          -p:PublishReadyToRun=true

    - name: Upload Single File Artifact
      uses: actions/upload-artifact@v4
      with:
        name: GremlinStudio-win-x64
        path: ./publish/win-x64-single/
        if-no-files-found: error

    - name: Upload Velopack Artifact
      uses: actions/upload-artifact@v4
      with:
        name: GremlinStudio-win-x64-velopack
        path: ./publish/win-x64-velopack/
        if-no-files-found: error

  create-installer:
    runs-on: windows-latest
    needs: build
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Download Single File Artifact
      uses: actions/download-artifact@v4
      with:
        name: GremlinStudio-win-x64
        path: ./StardustGremlinStudio/Stardust.Paradox.GremlinStudio/bin/publish/win-x64/

    - name: Download Velopack Artifact
      uses: actions/download-artifact@v4
      with:
        name: GremlinStudio-win-x64-velopack
        path: ./publish/win-x64-velopack/

    - name: Get version from project
      id: version
      run: |
        $xml = [xml](Get-Content ${{ env.PROJECT_PATH }})
        $version = $xml.Project.PropertyGroup.Version | Where-Object { $_ }
        if (-not $version) { $version = "1.0.0" }
        echo "VERSION=$version" >> $env:GITHUB_OUTPUT
        Write-Host "Detected version: $version"

    - name: Install Velopack CLI
      run: dotnet tool install -g vpk

    - name: Package with Velopack (for auto-updates)
      run: |
        vpk pack `
          --packId ${{ env.APP_ID }} `
          --packVersion ${{ steps.version.outputs.VERSION }} `
          --packDir ./publish/win-x64-velopack `
          --mainExe GremlinStudio.exe `
          --outputDir ./releases/velopack `
          --channel win `
          --icon StardustGremlinStudio/Stardust.Paradox.GremlinStudio/Resources/icon.ico

    - name: Validate Velopack output
      run: |
        if (-not (Test-Path ./releases/velopack/RELEASES)) {
          Write-Error "Velopack output missing RELEASES file. Auto-update will not work."
          exit 1
        }

        $nupkgs = Get-ChildItem -Path ./releases/velopack -Recurse -Filter "*.nupkg" -ErrorAction SilentlyContinue
        if (-not $nupkgs -or $nupkgs.Count -eq 0) {
          Write-Error "Velopack output missing .nupkg packages. Auto-update will not work."
          exit 1
        }

        Write-Host "Found RELEASES and $($nupkgs.Count) .nupkg package(s)."

    - name: List Velopack output files
      run: |
        Write-Host "Velopack output files:"
        Get-ChildItem -Path ./releases/velopack -Recurse | ForEach-Object { Write-Host $_.FullName }

    - name: Upload Velopack Release Artifact
      uses: actions/upload-artifact@v4
      with:
        name: GremlinStudio-Velopack-Release
        path: ./releases/velopack/
        if-no-files-found: error

    - name: Upload to Release
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v1
      with:
        files: |
          ./releases/velopack/**
          ./StardustGremlinStudio/Stardust.Paradox.GremlinStudio/bin/publish/win-x64/GremlinStudio.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
