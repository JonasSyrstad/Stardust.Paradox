name: Build Gremlin Studio

on:
  push:
    branches: [ V2.5,V2.6, main ]
    paths:
      - 'src/StardustGremlinStudio/**'
      - '.github/workflows/gremlin-studio-build.yml'
  pull_request:
    branches: [ V2.5, main ]
    paths:
      - 'src/StardustGremlinStudio/**'
  release:
    types: [ published ]
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0.x'
  PROJECT_PATH: 'src/StardustGremlinStudio/Stardust.Paradox.GremlinStudio/Stardust.Paradox.GremlinStudio.csproj'
  APP_ID: 'GremlinStudio'

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore ${{ env.PROJECT_PATH }}

    - name: Build
      run: dotnet build ${{ env.PROJECT_PATH }} -c Release --no-restore

    - name: Publish (Self-contained Single File)
      run: |
        dotnet publish ${{ env.PROJECT_PATH }} -c Release -o ./publish/win-x64-single `
          -r win-x64 `
          --self-contained true `
          -p:PublishSingleFile=true `
          -p:PublishReadyToRun=true `
          -p:IncludeNativeLibrariesForSelfExtract=true `
          -p:EnableCompressionInSingleFile=true

    - name: Publish (Self-contained for Velopack)
      run: |
        dotnet publish ${{ env.PROJECT_PATH }} -c Release -o ./publish/win-x64-velopack `
          -r win-x64 `
          --self-contained true `
          -p:PublishSingleFile=false `
          -p:PublishReadyToRun=true

    - name: Upload Single File Artifact
      uses: actions/upload-artifact@v4
      with:
        name: GremlinStudio-win-x64
        path: ./publish/win-x64-single/
        if-no-files-found: error

    - name: Upload Velopack Artifact
      uses: actions/upload-artifact@v4
      with:
        name: GremlinStudio-win-x64-velopack
        path: ./publish/win-x64-velopack/
        if-no-files-found: error

  create-installer:
    runs-on: windows-latest
    needs: build
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Download Single File Artifact
      uses: actions/download-artifact@v4
      with:
        name: GremlinStudio-win-x64
        path: src/StardustGremlinStudio/Stardust.Paradox.GremlinStudio/bin/publish/win-x64/

    - name: Download Velopack Artifact
      uses: actions/download-artifact@v4
      with:
        name: GremlinStudio-win-x64-velopack
        path: ./publish/win-x64-velopack/

    - name: Get version from project
      id: version
      run: |
        $xml = [xml](Get-Content ${{ env.PROJECT_PATH }})
        $version = $xml.Project.PropertyGroup.Version | Where-Object { $_ }
        if (-not $version) { $version = "1.0.0" }
        echo "VERSION=$version" >> $env:GITHUB_OUTPUT
        Write-Host "Detected version: $version"

    - name: Install Velopack CLI
      run: dotnet tool install -g vpk

    - name: Package with Velopack
      run: |
        vpk pack `
          --packId ${{ env.APP_ID }} `
          --packVersion ${{ steps.version.outputs.VERSION }} `
          --packDir ./publish/win-x64-velopack `
          --mainExe GremlinStudio.exe `
          --outputDir ./releases/velopack `
          --icon src/StardustGremlinStudio/Stardust.Paradox.GremlinStudio/Resources/icon.ico

    - name: Install Inno Setup
      run: |
        choco install innosetup -y
        
    - name: Build Installer
      run: |
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "src/StardustGremlinStudio\Installer\GremlinStudio.iss"

    - name: Upload Inno Setup Installer Artifact
      uses: actions/upload-artifact@v4
      with:
        name: GremlinStudio-Installer-InnoSetup
        path: ./dist/GremlinStudio-*-Setup.exe
        if-no-files-found: error

    - name: Upload Velopack Release Artifact
      uses: actions/upload-artifact@v4
      with:
        name: GremlinStudio-Installer-Velopack
        path: ./releases/velopack/
        if-no-files-found: error

    - name: Upload to Release
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v1
      with:
        files: |
          ./dist/GremlinStudio-*-Setup.exe
          ./releases/velopack/GremlinStudio-win-Setup.exe
          ./releases/velopack/GremlinStudio-win-Portable.zip
          ./releases/velopack/RELEASES
          src/StardustGremlinStudio/Stardust.Paradox.GremlinStudio/bin/publish/win-x64/GremlinStudio.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
